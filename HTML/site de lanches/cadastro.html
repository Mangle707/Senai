<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Pedido Personalizado</title>
    <link rel="stylesheet" href="CSS/cadastro.css">
</head>
<body>

    <div class="container">
        <h1>Lanche Rápido</h1>

        <div class="pedido-form">
            <label for="nome">Nome do Cliente:</label>
            <input type="text" id="nome" placeholder="Digite seu nome">

            <label for="produto">Produto:</label>
            <select id="produto">
                <option value="">Selecione</option>
                <option value="X-Burguer">X-Burguer - R$20,00</option>
                <option value="X-Salada">X-Salada - R$22,00</option>
                <option value="Refrigerante">Refrigerante - R$8,00</option>
            </select>

            <label for="quantidade">Quantidade:</label>
            <input type="number" id="quantidade" min="1" value="1">

            <button onclick="enviarPedido()">Enviar Pedido</button>
        </div>

        <div class="pedido-detalhes">
            <h2>Pedido Realizado</h2>
            <ul id="listaPedido"></ul>
            <p id="total">Total: R$ 0,00</p>
        </div>
    </div>

    <script src="JS/cadastro.js"></script>
</body>
</html>
