<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lanche Rápido</title>
    <link rel="stylesheet" href="CSS/style.css">
</head>
<body>

    <div class="container">
        <h1>Lanche Rápido</h1>

        <div class="produtos">

            <div class="card">
                <img src="https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=300" alt="X-Burguer">
                <h2>X-Burguer</h2>
                <p>R$ 20,00</p>
                <button onclick="adicionarPedido('X-Burguer', 20)">Pedir</button>
            </div>

            <div class="card">
                <img src="https://images.unsplash.com/photo-1550547660-d9450f859349?w=300" alt="X-Salada">
                <h2>X-Salada</h2>
                <p>R$ 22,00</p>
                <button onclick="adicionarPedido('X-Salada', 22)">Pedir</button>
            </div>

            <div class="card">
                <img src="https://images.unsplash.com/photo-1624517452488-04869289c4ca?w=300" alt="Refrigerante">
                <h2>Refrigerante</h2>
                <p>R$ 8,00</p>
                <button onclick="adicionarPedido('Refrigerante', 8)">Pedir</button>
            </div>

        </div>

        <div class="pedido">
            <h2>Pedido Atual</h2>
            <ul id="listaPedido"></ul>
            <p id="total">Total: R$ 0,00</p>
        </div>
    </div>

    <script src="JS/script.js"></script>
</body>
<footer>
    <div class="footer-content">
        <p>&copy; 2025 Lanche Rápido - Todos os direitos reservados.</p>
        <p>Rua das Lanchonetes, 123 | (11) 99999-9999</p>
    </div>
</footer>
</html>
